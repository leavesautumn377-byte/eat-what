    <text x="254" y="42" text-anchor="middle" fill="#294932" font-family="KaiTi,STKaiti,serif" font-size="22">记这一顿</text>
  </g>
  <path d="M0 793h390" stroke="#8ca58b" stroke-opacity=".34"/>
  <g font-family="Songti SC,serif" font-size="14" text-anchor="middle"><text x="65" y="829" fill="#315a3d">选一顿</text><text x="195" y="829" fill="#789079">清单</text><text x="325" y="829" fill="#789079">记录</text></g>
