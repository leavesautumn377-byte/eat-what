<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844">
  <defs>
    <linearGradient id="paper" x2=".2" y2="1"><stop stop-color="#f8f6ec"/><stop offset="1" stop-color="#f2f0e5"/></linearGradient>
    <radialGradient id="wash"><stop stop-color="#91ad80" stop-opacity=".52"/><stop offset=".55" stop-color="#a7bc94" stop-opacity=".38"/><stop offset="1" stop-color="#b4c7a4" stop-opacity="0"/></radialGradient>
    <radialGradient id="warm"><stop stop-color="#c1715c" stop-opacity=".33"/><stop offset="1" stop-color="#c1715c" stop-opacity="0"/></radialGradient>
    <filter id="bleed" x="-35%" y="-35%" width="170%" height="170%"><feGaussianBlur stdDeviation="8"/></filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="2.5"/></filter>
    <pattern id="fiber" width="9" height="9" patternUnits="userSpaceOnUse"><path d="M1 2h1M6 7h1M4 4h.5" stroke="#a9ad95" stroke-opacity=".11" stroke-width=".5"/></pattern>
  </defs>
  <rect width="390" height="844" fill="url(#paper)"/><rect width="390" height="844" fill="url(#fiber)"/>
