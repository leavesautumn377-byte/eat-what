  <g fill="#294932" font-family="KaiTi,STKaiti,Songti SC,serif">
    <text x="26" y="48" font-size="20" letter-spacing="3">今天吃什么</text>
    <text x="27" y="131" font-size="49">下一顿，</text>
    <text x="27" y="194" font-size="49">就这样定了。</text>
    <text x="29" y="390" font-size="37">番茄牛肉面</text>
  </g>
  <text x="28" y="92" fill="#78916e" font-family="serif" font-size="10" letter-spacing="3">A QUIET MEAL / 01</text>
  <text x="30" y="226" fill="#68816b" font-family="Songti SC,serif" font-size="13">想吃什么，交给今天的心情。</text>
  <path d="M27 317h231" stroke="#5f7e5c" stroke-opacity=".3"/>
  <text x="28" y="350" fill="#69856d" font-family="Songti SC,serif" font-size="12" letter-spacing="2">这一顿抽到了</text>
  <text x="31" y="419" fill="#69806d" font-family="Songti SC,serif" font-size="12">二食堂 · 午饭 · 热乎乎很治愈</text>
  <g transform="translate(24 690)">
    <ellipse cx="85" cy="34" rx="91" ry="35" fill="url(#wash)"/>
    <ellipse cx="254" cy="34" rx="98" ry="38" fill="url(#wash)"/>
